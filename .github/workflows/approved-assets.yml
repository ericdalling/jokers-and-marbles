name: Approved visual assets
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/prepare-approved-assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: approved-visual-assets
          path: Assets/Approved/
