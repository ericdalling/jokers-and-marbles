name: JokersAndMarbles
options:
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
packages:
  GameCore:
    path: .
targets:
  JokersController:
    type: application
    platform: iOS
    sources: [Apps/Controller, Apps/Shared, Apps/TV/ModularBoardView.swift]
    preBuildScripts:
      - name: Prepare approved materials
        script: |
          set -e
          python3 "$SRCROOT/scripts/prepare-approved-assets.py"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/Assets/Approved/Materials/"*.jpg "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          cp "$SRCROOT/Assets/Approved/Models/master-piece.glb" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          python3 "$SRCROOT/scripts/prepare-branding.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GameCore
        product: GameCore
    info:
      path: Config/Controller-Info.plist
      properties:
        NSCameraUsageDescription: Scan the game room QR code.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [jokersmarbles]
        NSLocalNetworkUsageDescription: Connect to your local Jokers and Marbles game.
        NSBonjourServices: ['_jokers-marble._tcp']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdalling.jokersandmarbles.controller
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  JokersTV:
    type: application
    platform: tvOS
    sources: [Apps/TV, Apps/Shared]
    preBuildScripts:
      - name: Prepare approved materials
        script: |
          set -e
          python3 "$SRCROOT/scripts/prepare-approved-assets.py"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/Assets/Approved/Materials/"*.jpg "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          cp "$SRCROOT/Assets/Approved/Models/master-piece.glb" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          python3 "$SRCROOT/scripts/prepare-branding.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GameCore
        product: GameCore
    info:
      path: Config/TV-Info.plist
      properties:
        NSLocalNetworkUsageDescription: Connect to your local Jokers and Marbles game.
        NSBonjourServices: ['_jokers-marble._tcp']
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: BrandAssets
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdalling.jokersandmarbles.tv
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  JokersController:
    build:
      targets:
        JokersController: all
  JokersTV:
    build:
      targets:
        JokersTV: all
